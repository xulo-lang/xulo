[package]
name = "xulo-compiler"
version.workspace = true
edition.workspace = true

[dependencies]
xulo-core = { workspace = true }
xulo-parser = { workspace = true }
xulo-semantic = { workspace = true }
xulo-runtime = { workspace = true }
xulo-std = { workspace = true }
cranelift = "0.110"
cranelift-frontend = "0.110"
cranelift-module = "0.110"
cranelift-jit = "0.110"
cranelift-object = "0.110"
cranelift-native = "0.110"
target-lexicon = "0.13"
inkwell = { version = "0.11", optional = true, default-features = false, features = ["llvm22-1"] }

[features]
default = []
# LLVM AOT backend. Requires an LLVM 22 development installation
# (`llvm-config-22`); disabled by default so plain `cargo test` needs no LLVM.
llvm = ["dep:inkwell"]
# Prefer the shared libLLVM (faster local builds/tests). Implies `llvm`.
llvm-dynamic = ["llvm", "inkwell/llvm22-1-prefer-dynamic"]
# Link LLVM statically (distribution builds). Implies `llvm`.
llvm-static = ["llvm", "inkwell/llvm22-1-force-static"]

[dev-dependencies]
