[package]
name = "xulo-compiler"
version.workspace = true
edition.workspace = true

[dependencies]
xulo-core = { workspace = true }
xulo-parser = { workspace = true }
xulo-semantic = { workspace = true }
xulo-runtime = { workspace = true }
xulo-std = { workspace = true }
cranelift = "0.110"
cranelift-frontend = "0.110"
cranelift-module = "0.110"
cranelift-jit = "0.110"
cranelift-object = "0.110"
cranelift-native = "0.110"
target-lexicon = "0.13"
inkwell = { version = "0.4", optional = true, default-features = false, features = ["llvm15-0"] }

[features]
default = []
# LLVM AOT backend. Requires an LLVM 15 development installation
# (`llvm-config-15`); disabled by default so plain `cargo test` needs no LLVM.
llvm = ["dep:inkwell"]
# Link LLVM statically (distribution builds). Implies `llvm`.
llvm-static = ["llvm", "inkwell/llvm15-0-force-static"]

[dev-dependencies]
