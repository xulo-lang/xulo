[package]
name = "xupm"
version.workspace = true
edition.workspace = true

[[bin]]
name = "xupm"
path = "src/main.rs"

[features]
default = []
# LLVM AOT backend (the product build path). Requires LLVM 22 dev libraries.
llvm = ["xulo-compiler/llvm"]
# Prefer the shared libLLVM (faster local builds/tests).
llvm-dynamic = ["llvm", "xulo-compiler/llvm-dynamic"]
# Statically link LLVM (distribution artifacts).
llvm-static = ["llvm", "xulo-compiler/llvm-static"]
# Distribution builds must never silently ship the Cranelift fallback.
distribution = ["llvm-static"]
# Stage-0 preview builds for hosts without a static LLVM (macOS/Windows).
cranelift = []

[dependencies]
clap = { workspace = true }
toml = "0.8"
xulo-cli = { workspace = true }
xulo-compiler = { workspace = true }
xulo-core = { workspace = true }
