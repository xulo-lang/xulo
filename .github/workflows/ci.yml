name: CI

on:
  push:
    branches: [main, master]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check-build-test:
    name: Check, build, and test (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux
            os: ubuntu-latest
          - name: macos
            os: macos-14
          - name: windows
            os: windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Set up MSVC environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Format check
        run: cargo fmt --check

      - name: Clippy (deny warnings)
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace

      - name: Build release binary
        run: cargo build --release --workspace

      - name: AOT differential examples (Linux and macOS)
        if: runner.os != 'Windows'
        env:
          XULO_AOT_DIFFERENTIAL: "1"
          XULO_RUNTIME_LIB: ${{ github.workspace }}/target/release/libxulo_runtime.a
        run: cargo test -p xupm --test aot_differential -- --nocapture

      # WP3/B7: the same differential on Windows, with no parked list: every
      # example (including `extern "C"` FFI) builds and matches the interpreter.
      - name: AOT differential examples (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          XULO_AOT_DIFFERENTIAL: "1"
          XULO_RUNTIME_LIB: ${{ github.workspace }}\target\release\xulo_runtime.lib
        run: cargo test -p xupm --test aot_differential -- --nocapture

      - name: AOT smoke test (macOS)
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          XULO_RUNTIME_LIB="$PWD/target/release/libxulo_runtime.a" \
            target/release/xupm build examples/basics/hello.xulo --release
          test "$(examples/basics/.xupm/build/hello)" = "Hello, world!"

      - name: AOT smoke test (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $env:XULO_RUNTIME_LIB = "$PWD\target\release\xulo_runtime.lib"
          & target\release\xupm.exe build examples\basics\hello.xulo --release
          $out = & examples\basics\.xupm\build\hello.exe
          if ($out -ne "Hello, world!") { throw "AOT smoke test failed: $out" }

  conformance:
    name: Spec conformance and repository pins
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      # WP0 (T7): the readiness matrix is written against pinned submodules.
      - name: Submodule pins match docs/stage1-readiness.md
        run: cargo test -p xulo-cli --test submodule_pins -- --nocapture

      # WP0 (T3a–T3d): every annotated `xulo` example in the pinned spec is
      # checked or run; failing examples must be triaged in
      # crates/xulo-cli/tests/spec_conformance_baseline.tsv.
      - name: Pinned spec examples conform
        run: cargo test -p xulo-cli --test spec_conformance -- --nocapture

      # WP6: stage 1's bootstrap suite runs beside the conformance runner, so
      # the self-host corpus is a conformance gate and not only a workspace
      # test. `runs_stage1_test_file` covers `xupm test` on `xuloc/tests.xulo`.
      - name: Stage 1 bootstrap suite
        run: |
          cargo test -p xulo-cli --test stage1 -- --nocapture
          cargo test -p xupm --test cli runs_stage1_test_file -- --nocapture

      # WP6: stage 1 compiles the accept corpus, builds itself into stage 2,
      # and the two compilers agree on the bootstrap suite. The C compiler is
      # the host `clang`; the test produces the runtime library it links.
      - name: Stage 1 self-host build
        env:
          XULO_STAGE1_BUILD: "1"
          XULO_STAGE1_REQUIRED: "1"
        run: cargo test -p xupm --test stage1_build -- --nocapture

  examples:
    name: Run examples
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The coverage gate reads spec/grammar.md's production index.
          submodules: recursive

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build CLI
        run: cargo build --release -p xulo-cli

      # T2/T8: the examples gate discovers every program unit, checks it, runs
      # it, compares stdout/stderr with the recorded sidecar, and proves the
      # coverage table matches the grammar's production index.
      - name: Examples gate
        run: XULO_BIN=target/release/xulo cargo test -p xulo-cli --test examples -- --nocapture

  llvm-backend:
    runs-on: ubuntu-22.04
    env:
      LLVM_SYS_221_PREFIX: /usr/lib/llvm-22
      XULO_RUNTIME_LIB: ${{ github.workspace }}/target/release/libxulo_runtime.a
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install LLVM 22
        run: |
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key | \
            sudo tee /etc/apt/trusted.gpg.d/apt.llvm.org.asc > /dev/null
          sudo add-apt-repository -y \
            "deb https://apt.llvm.org/jammy/ llvm-toolchain-jammy-22 main"
          sudo apt-get update
          sudo apt-get install -y llvm-22-dev clang-22 lld-22 libpolly-22-dev \
            zlib1g-dev libzstd-dev libffi-dev libxml2-dev libedit-dev libncurses5-dev

      - name: Build runtime static library
        run: cargo build -p xulo-runtime --release

      - name: Clippy (LLVM feature)
        run: |
          cargo clippy -p xulo-compiler --all-targets --features llvm-dynamic -- -D warnings
          cargo clippy -p xupm --all-targets --features llvm-dynamic -- -D warnings

      - name: Golden and differential tests
        run: |
          XULO_LLVM=1 cargo test -p xulo-compiler --features llvm-dynamic \
            --test llvm_golden_tests --test llvm_differential_tests

      - name: Build distribution binary (static LLVM)
        run: cargo build -p xupm --release --features distribution

      - name: Build and run an LLVM executable
        run: |
          target/release/xupm build examples/basics/hello.xulo --release
          test "$(examples/basics/.xupm/build/hello)" = "Hello, world!"
