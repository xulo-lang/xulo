name: CI

on:
  push:
    branches: [main, master]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check-build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Format check
        run: cargo fmt --check

      - name: Clippy (deny warnings)
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace

      - name: Build release binary
        run: cargo build --release --workspace

      - name: Run all examples
        run: |
          set -e
          for f in examples/*.xulo; do
            echo "== Running $f =="
            target/release/xulo run "$f" > /dev/null
          done

      - name: Run all core examples natively
        run: |
          set -e
          for f in examples/hello.xulo examples/arithmetic.xulo examples/if_else.xulo examples/fibonacci.xulo examples/async_tasks.xulo examples/trait_shapes.xulo; do
            echo "== Native run $f =="
            target/release/xulo run --native "$f" > /dev/null
          done

      - name: Run module example natively
        run: |
          set -e
          target/release/xulo run --native examples/modules/main.xulo > /dev/null