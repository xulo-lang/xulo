name: CI

on:
  push:
    branches: [main, master]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check-build-test:
    name: Check, build, and test (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux
            os: ubuntu-latest
          - name: macos
            os: macos-14
          - name: windows
            os: windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Set up MSVC environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Format check
        run: cargo fmt --check

      - name: Clippy (deny warnings)
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace

      - name: Build release binary
        run: cargo build --release --workspace

      - name: AOT smoke test (macOS)
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          XULO_RUNTIME_LIB="$PWD/target/release/libxulo_runtime.a" \
            target/release/xupm build examples/hello.xulo --release
          test "$(examples/.xupm/build/hello)" = "Hello, world!"

      - name: AOT smoke test (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $env:XULO_RUNTIME_LIB = "$PWD\target\release\xulo_runtime.lib"
          & target\release\xupm.exe build examples\hello.xulo --release
          $out = & examples\.xupm\build\hello.exe
          if ($out -ne "Hello, world!") { throw "AOT smoke test failed: $out" }

  examples:
    name: Run examples
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build CLI
        run: cargo build --release -p xulo-cli

      - name: Run all examples
        run: |
          set -e
          for f in examples/*.xulo; do
            echo "== Running $f =="
            target/release/xulo run "$f" > /dev/null
          done

      - name: Run module example
        run: target/release/xulo run examples/modules/main.xulo > /dev/null

  llvm-backend:
    runs-on: ubuntu-22.04
    env:
      LLVM_SYS_221_PREFIX: /usr/lib/llvm-22
      XULO_RUNTIME_LIB: ${{ github.workspace }}/target/release/libxulo_runtime.a
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install LLVM 22
        run: |
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key | \
            sudo tee /etc/apt/trusted.gpg.d/apt.llvm.org.asc > /dev/null
          sudo add-apt-repository -y \
            "deb https://apt.llvm.org/jammy/ llvm-toolchain-jammy-22 main"
          sudo apt-get update
          sudo apt-get install -y llvm-22-dev clang-22 lld-22 libpolly-22-dev \
            zlib1g-dev libzstd-dev libffi-dev libxml2-dev libedit-dev libncurses5-dev

      - name: Build runtime static library
        run: cargo build -p xulo-runtime --release

      - name: Clippy (LLVM feature)
        run: |
          cargo clippy -p xulo-compiler --all-targets --features llvm-dynamic -- -D warnings
          cargo clippy -p xupm --all-targets --features llvm-dynamic -- -D warnings

      - name: Golden and differential tests
        run: |
          XULO_LLVM=1 cargo test -p xulo-compiler --features llvm-dynamic \
            --test llvm_golden_tests --test llvm_differential_tests

      - name: Build distribution binary (static LLVM)
        run: cargo build -p xupm --release --features distribution

      - name: Build and run an LLVM executable
        run: |
          target/release/xupm build examples/hello.xulo --release
          test "$(examples/.xupm/build/hello)" = "Hello, world!"
